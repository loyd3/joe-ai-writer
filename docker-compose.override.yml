# ============================================
# Docker Compose 开发环境覆盖配置
# 自动加载，无需指定 -f
# ============================================

version: '3.8'

services:
  backend:
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - DEBUG=true
    command: >
      sh -c "python init_db.py --auto &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0

# ============================================
# Docker Compose - 使用 Docker Hub 镜像 + 独立端口
#
# 这个配置直接使用 Docker Hub 上的镜像，不需要本地构建
# 端口与本地开发完全区分:
#   - 前端: 8080 (本地开发用 5173)
#   - 后端: 8001 (本地开发用 8000)
#   - 数据库: 3307 (本地开发用 3306)
#
# 使用方法:
#   docker-compose -f docker-compose.hub.yml up -d
#
# 更新到最新镜像:
#   docker-compose -f docker-compose.hub.yml pull
#   docker-compose -f docker-compose.hub.yml up -d
# ============================================

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: joe-writer-mysql-hub
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joe_writer}
      MYSQL_USER: ${MYSQL_USER:-joewriter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joewriter123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_hub_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - joe-writer-hub-network

  # 后端服务 - 使用 Docker Hub 镜像
  backend:
    image: loyd3/joe-ai-writer-backend:latest
    container_name: joe-writer-backend-hub
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-joewriter}:${MYSQL_PASSWORD:-joewriter123}@mysql:3306/${MYSQL_DATABASE:-joe_writer}?charset=utf8mb4
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 3600
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL}
      CUSTOM_MODEL: ${CUSTOM_MODEL}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "false"
      TZ: Asia/Shanghai
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joe-writer-hub-network

  # 前端服务 - 使用 Docker Hub 镜像
  frontend:
    image: loyd3/joe-ai-writer-frontend:latest
    container_name: joe-writer-frontend-hub
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8001
    ports:
      - "8080:5173"
    depends_on:
      - backend
    networks:
      - joe-writer-hub-network

volumes:
  mysql_hub_data:
    driver: local

networks:
  joe-writer-hub-network:
    driver: bridge

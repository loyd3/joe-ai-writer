# ============================================
# Joe AI Writer - macOS 本地 Docker（Docker Desktop）
# ============================================
# 与 docker-compose.yml 等价，针对 Mac 绑定卷使用 consistency: cached，
# 减轻 Docker Desktop 文件同步延迟。
#
# 使用方式:
#   docker compose -f docker-compose.mac.yml up -d --build
#   或: ./deploy-docker-mac.sh
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: joe-writer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joe_writer}
      MYSQL_USER: ${MYSQL_USER:-joewriter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joewriter123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./backend/database/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        consistency: cached
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - joe-writer-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joe-writer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-joewriter}:${MYSQL_PASSWORD:-joewriter123}@mysql:3306/${MYSQL_DATABASE:-joe_writer}?charset=utf8mb4
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 3600
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL}
      CUSTOM_MODEL: ${CUSTOM_MODEL}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "false"
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ./backend
        target: /app
        consistency: cached
      - /app/__pycache__
    ports:
      - "9000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joe-writer-network
    command: >
      sh -c "python init_db.py --auto &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joe-writer-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:9000
      - NODE_ENV=development
    volumes:
      - type: bind
        source: ./frontend
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - "8080:5173"
    depends_on:
      - backend
    networks:
      - joe-writer-network
    command: >
      sh -c "echo 'VITE_API_URL=http://localhost:9000' > /app/.env.local &&
             npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
    driver: local

networks:
  joe-writer-network:
    driver: bridge

# ============================================
# Docker Compose - 生产环境（端口与本地开发区分）
# 
# 本地开发端口:
#   - 前端: 5173 (npm run dev)
#   - 后端: 8000 (uvicorn)
#   - 数据库: 3306 (本地 MySQL)
#
# Docker 运行端口（避免冲突）:
#   - 前端: 8080
#   - 后端: 8001
#   - 数据库: 3307
#
# 使用方法:
#   docker-compose -f docker-compose.prod-ports.yml up -d
# ============================================

version: '3.8'

services:
  # MySQL 数据库 (Docker 内部)
  mysql:
    image: mysql:8.0
    container_name: joe-writer-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joe_writer}
      MYSQL_USER: ${MYSQL_USER:-joewriter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joewriter123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 映射到 3307，避免与本地 3306 冲突
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - joe-writer-prod-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 或者使用 Docker Hub 镜像:
    # image: loyd3/joe-ai-writer-backend:latest
    container_name: joe-writer-backend-prod
    restart: unless-stopped
    environment:
      # 连接 Docker 内部的 MySQL
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-joewriter}:${MYSQL_PASSWORD:-joewriter123}@mysql:3306/${MYSQL_DATABASE:-joe_writer}?charset=utf8mb4
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 3600
      # AI 配置
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      # DeepSeek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      # SiliconFlow
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      # Custom
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL}
      CUSTOM_MODEL: ${CUSTOM_MODEL}
      # 应用配置
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "false"
      TZ: Asia/Shanghai
    ports:
      # 映射到 8001，避免与本地 8000 冲突
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joe-writer-prod-network
    command: >
      sh -c "python init_db.py --auto &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # 或者使用 Docker Hub 镜像:
    # image: loyd3/joe-ai-writer-frontend:latest
    container_name: joe-writer-frontend-prod
    restart: unless-stopped
    environment:
      # 指向 Docker 后端端口 8001
      - VITE_API_URL=http://localhost:8001
    ports:
      # 映射到 8080，避免与本地 5173 冲突
      - "8080:5173"
    depends_on:
      - backend
    networks:
      - joe-writer-prod-network
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_prod_data:
    driver: local

networks:
  joe-writer-prod-network:
    driver: bridge

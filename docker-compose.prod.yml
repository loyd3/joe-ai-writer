# ============================================
# 墨心 AI 写作工具 - 生产环境 Docker Compose 配置
# ============================================
# 使用方法:
#   1. 修改镜像地址为你发布的镜�?#   2. 配置 .env.prod 环境变量
#   3. docker-compose -f docker-compose.prod.yml up -d
# ============================================

version: '3.8'

services:
  # MySQL 数据�?  mysql:
    image: mysql:8.0
    container_name: joe-writer-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joe_writer}
      MYSQL_USER: ${MYSQL_USER:-joewriter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_db_password}
      TZ: Asia/Shanghai
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - joe-writer-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    # 生产环境不暴露端口到外部
    # 仅在容器网络内访�?
  # 后端服务
  backend:
    # 修改为你的镜像地址
    image: ${DOCKER_REGISTRY:-}/joe-ai-writer-backend:${VERSION:-latest}
    container_name: joe-writer-backend-prod
    restart: always
    environment:
      # 数据库配�?      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-joewriter}:${MYSQL_PASSWORD:-changeme_db_password}@mysql:3306/${MYSQL_DATABASE:-joe_writer}?charset=utf8mb4
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      
      # AI 配置
      AI_PROVIDER: ${AI_PROVIDER:-custom}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      
      # Ollama/自定�?API 配置
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-ollama}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-http://host.docker.internal:11434/v1}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-qwen3:30b}
      
      # 应用配置
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "false"
      TZ: Asia/Shanghai
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joe-writer-prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # 前端服务
  frontend:
    # 修改为你的镜像地址
    image: ${DOCKER_REGISTRY:-}/joe-ai-writer-frontend:${VERSION:-latest}
    container_name: joe-writer-frontend-prod
    restart: always
    environment:
      - VITE_API_URL=http://${SERVER_HOST:-localhost}:${BACKEND_PORT:-9000}
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    depends_on:
      - backend
    networks:
      - joe-writer-prod-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Nginx 反向代理（可选）
  # 取消注释以下配置以启�?Nginx
  # nginx:
  #   image: nginx:alpine
  #   container_name: joe-writer-nginx-prod
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - joe-writer-prod-network

volumes:
  mysql_prod_data:
    driver: local

networks:
  joe-writer-prod-network:
    driver: bridge

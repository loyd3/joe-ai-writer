# ============================================
# Joe AI Writer - Docker Compose 配置
# ============================================
# 使用方法:
#   1. 复制 .env.example 为 .env 并配置
#   2. docker-compose up -d        # 启动所有服务
#   3. docker-compose down         # 停止服务
#   4. docker-compose logs -f      # 查看日志
# ============================================

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: joe-writer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joe_writer}
      MYSQL_USER: ${MYSQL_USER:-joewriter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joewriter123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 映射到宿主机 3307，便于本地 python start.py 连接 Docker MySQL
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - joe-writer-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joe-writer-backend
    restart: unless-stopped
    environment:
      # 数据库配置
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-joewriter}:${MYSQL_PASSWORD:-joewriter123}@mysql:3306/${MYSQL_DATABASE:-joe_writer}?charset=utf8mb4  # 内部仍使用 3306，容器间通信
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 3600
      # AI 配置
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      # DeepSeek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      # SiliconFlow
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      # Custom
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL}
      CUSTOM_MODEL: ${CUSTOM_MODEL}
      # 应用配置
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "9000:8000"  # Docker 使用 9000，避免与本地开发 8000 冲突
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joe-writer-network
    command: >
      sh -c "python init_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # 前端开发服务器
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joe-writer-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:9000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:5173"
    depends_on:
      - backend
    networks:
      - joe-writer-network
    command: >
      sh -c "echo 'VITE_API_URL=http://localhost:9000' > /app/.env.local &&
             npm run dev -- --host 0.0.0.0"

  # 前端生产环境 (可选)
  # 取消注释下方配置以启用 Nginx 生产服务器
  # nginx:
  #   image: nginx:alpine
  #   container_name: joe-writer-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./frontend/dist:/usr/share/nginx/html:ro
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - joe-writer-network

volumes:
  mysql_data:
    driver: local

networks:
  joe-writer-network:
    driver: bridge

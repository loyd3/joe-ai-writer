# ============================================
# macOS 本地 Docker - 使用宿主机 MySQL（Docker Desktop）
# ============================================
# 在 .env 中配置 LOCAL_MYSQL_*（见 .env.docker.mac 说明）。
# 容器通过 host.docker.internal 访问 Mac 上的 MySQL。
#
#   docker compose -f docker-compose.mac.local-db.yml --env-file .env up -d --build
# ============================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joe-writer-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${LOCAL_MYSQL_USER:-root}:${LOCAL_MYSQL_PASSWORD}@host.docker.internal:${LOCAL_MYSQL_PORT:-3306}/${LOCAL_MYSQL_DATABASE:-joe_writer}?charset=utf8mb4
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      DB_POOL_RECYCLE: 3600
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL}
      CUSTOM_MODEL: ${CUSTOM_MODEL}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "false"
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./backend
        target: /app
        consistency: cached
      - /app/__pycache__
    ports:
      - "9000:8000"
    networks:
      - joe-writer-network
    command: >
      sh -c "python init_db.py --auto &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joe-writer-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:9000
      - NODE_ENV=development
    volumes:
      - type: bind
        source: ./frontend
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - "8080:5173"
    depends_on:
      - backend
    networks:
      - joe-writer-network
    command: >
      sh -c "echo 'VITE_API_URL=http://localhost:9000' > /app/.env.local &&
             npm run dev -- --host 0.0.0.0"

networks:
  joe-writer-network:
    driver: bridge
